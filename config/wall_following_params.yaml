wall_follower_controller:
  ros__parameters:
    use_sim_time: true

    # Control parameters
    # turtlebot3_world is a 5x5 m arena; a 1.4 m standoff was wider than the
    # free space between the outer wall and the inner obstacles.
    desired_distance: 0.5           # Target distance from wall (meters)
    forward_speed: 0.18             # Normal forward speed (m/s)
    search_speed: 0.12              # Speed while searching for wall (m/s)
    max_angular_speed: 1.0          # Maximum rotation speed (rad/s)

    # PID controller gains
    # The derivative term divides by dt=0.05, so it is 20x more sensitive than
    # the proportional term. kd is filtered in the node; keep it modest.
    kp: 2.0                         # Proportional gain
    kd: 0.6                         # Derivative gain
    # Two-beam wall estimate: side beam plus one swung beam_spread_deg forward.
    # The error is the wall distance predicted lookahead_distance ahead, so a
    # heading that converges on the wall is corrected before it arrives.
    lookahead_distance: 0.3         # metres ahead used for the predicted distance
    beam_spread_deg: 40.0           # angle between the two wall beams

    # Safety distances (meters)
    # Must satisfy: side_clearance < wall_min < desired < wall_lost
    # and emergency_stop < slow_down.
    emergency_stop_distance: 0.35   # Immediate stop distance
    slow_down_distance: 0.80        # Start slowing down distance
    wall_min_distance: 0.28         # Minimum acceptable wall distance
    wall_lost_distance: 1.2         # Distance to consider wall lost
    side_clearance: 0.25            # Minimum side obstacle clearance

    # Behavior parameters
    search_period_cycles: 60        # Cycles before reversing search direction (20Hz)
    stuck_threshold_cycles: 3       # Cycles before declaring stuck condition
