name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/wall_following_project
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select wall_following_project --event-handlers console_direct+
      - name: Package installed
        run: |
          source install/setup.bash
          ros2 pkg prefix wall_following_project
      - name: Node test over real topics
        run: |
          source install/setup.bash
          cd src/wall_following_project
          python3 -m pytest test/test_node_topics.py -v
      - name: Launch test (node as its own process, shipped params)
        run: |
          source install/setup.bash
          cd src/wall_following_project
          SCENE_CSV=$GITHUB_WORKSPACE/scenes.csv launch_test test/test_launch_scenes.py
          python3 scripts/plot_scenes.py $GITHUB_WORKSPACE/scenes.csv $GITHUB_WORKSPACE/scenes.svg "Python wall follower, launch test scenes"
      - name: Upload the scene trace
        uses: actions/upload-artifact@v4
        with:
          name: scenes
          path: |
            scenes.csv
            scenes.svg
